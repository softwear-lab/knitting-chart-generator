<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Schematów Dziewiarskich</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <link rel="stylesheet" href="style.css">
  <script src="sketch.js" defer></script>
</head>
<body>
  <h1>Generator Schematów Dziewiarskich</h1>
  <p>Wgraj zdjęcie, określ szerokość w oczkach i wygeneruj schemat!</p>
  
  <div id="ui-container">
    <div class="control-group">
      <label>1. Wgraj obrazek:</label>
      <div id="upload-container"></div>
    </div>
    
    <div class="control-group">
      <label>2. Szerokość (ilość oczek):</label>
      <div id="input-container"></div>
    </div>
    
    <div class="control-group">
      <label>3. Akcja:</label>
      <div id="buttons-container"></div>
    </div>
  </div>

  <div id="canvas-container"></div>
</body>
</html>
