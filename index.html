<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knitting Chart Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <link rel="stylesheet" href="style.css">
  <script src="sketch.js" defer></script>
</head>
<body>
  <h1>Knitting Chart Generator</h1>
  <p>Upload an image, adjust parameters, and generate your chart!</p>
  
  <div id="main-content">
    
    <div id="ui-container">
      <div class="control-group full-width" id="grid-container"></div>

      <div class="control-group">
        <label>1. Upload image:</label>
        <div id="upload-container"></div>
      </div>
      
      <div class="control-group">
        <label>2. Width (stitches):</label>
        <div id="input-container"></div>
      </div>

      <div class="control-group">
        <label>3. Color mode:</label>
        <div id="color-mode-container"></div>
        <div id="color-count-container" style="margin-top: 5px;"></div>
        <div id="custom-colors-container"></div>
      </div>
      
      <div class="control-group">
        <label>4. Action:</label>
        <div id="buttons-container"></div>
      </div>
    </div>

    <div id="canvas-container"></div>
    
  </div>
</body>
</html>
